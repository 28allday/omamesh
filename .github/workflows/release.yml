# Builds the release package in a clean Arch Linux container pointed at the
# Omarchy mirror, so it is linked against the Qt that Omarchy users have on
# release day rather than whatever the maintainer's machine happens to have.
# A binary built against a newer Qt than the mirror ships will not start for
# anyone else, and the Omarchy mirror lags the main Arch repositories.
name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Use the Omarchy mirror
        run: |
          echo 'Server = https://stable-mirror.omarchy.org/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: Install dependencies
        # makepkg checks the runtime dependencies too, so install the whole
        # list from the PKGBUILD, not only what the build needs.
        run: |
          pacman -Syyu --noconfirm --needed git \
            qt6-base qt6-declarative qt6-quick3d \
            hicolor-icon-theme assimp qt6-imageformats xdg-desktop-portal \
            bash bzip2 curl pciutils tar

      - uses: actions/checkout@v4

      - name: Build the package
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          chown -R builder .
          cd pkgbuild
          su builder -c 'makepkg -f --noconfirm'
          sha256sum omamesh-*.pkg.tar.zst > SHA256SUMS
          pacman -Qip omamesh-*.pkg.tar.zst | grep -E '^(Version|Depends On)'

      - name: Check the binary's Qt requirement
        run: |
          cd pkgbuild
          need="$(objdump -p ../build/omamesh | grep -o 'Qt_6\.[0-9]*' | sort -uV | tail -n 1)"
          have="$(qmake6 -query QT_VERSION | cut -d. -f1,2)"
          echo "binary needs $need, the Omarchy mirror has Qt $have"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pkgbuild/omamesh-*.pkg.tar.zst
            pkgbuild/SHA256SUMS
